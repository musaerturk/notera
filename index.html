
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NOTERA - Öğretmenler için AI destekli akıllı sınav okuma ve analiz platformu">
    <meta name="theme-color" content="#3B2F5B">
    <title>NOTERA | Değerlendirmenin Akıllı Yolu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              notera: {
                purple: '#3B2F5B',
                turquoise: '#4FB6B2',
                gray: '#F1F5F9',
                dark: '#1E1B2E'
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3B2F5B; border-radius: 10px; }
        
        .logo-o { position: relative; display: inline-block; padding: 0 1px; }
        .logo-o::after {
          content: '';
          position: absolute;
          top: 50%; left: 50%;
          transform: translate(-50%, -50%);
          width: 6px; height: 6px;
          background: #4FB6B2;
          border-radius: 50%;
          box-shadow: 0 0 12px rgba(79, 182, 178, 0.6);
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

}
</script>

<script type="module" src="/index.tsx"></script>
</body>
</html>
